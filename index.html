<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animus Reconstruction｜数字世界重建器</title>
  </head>
  <body>
    <div id="app">
      <main class="viewport">
        <div class="topbar"><span class="mark">AR</span><strong>Animus Reconstruction</strong><span class="version">可选预览示例</span></div>
        <div id="stage" role="img" aria-label="三维场景预览"></div>
        <div class="stage-hint">拖拽旋转 · 滚轮缩放 · Shift + 单击设置重建原点 · 拖入 GLB</div>
      </main>
      <aside class="sidebar">
        <h2>数字世界重建器</h2>
        <p class="desc">将三维场景从数字虚空逐步重建。这里展示的是可选场景预览示例，完整重建效果尚待开发。</p>
        <section>
          <h3>场景</h3>
          <label class="upload" for="model-file">选择 GLB 文件</label>
          <input id="model-file" type="file" accept=".glb,model/gltf-binary" />
          <button id="demo-btn" type="button">恢复内置测试场景</button>
          <p id="scene-status" class="status">内置测试场景已加载</p>
        </section>
        <section>
          <h3>重建原点</h3>
          <p id="origin-label" class="value">X 0.00 / Y 0.00 / Z 0.00</p>
          <p class="desc">Shift + 单击模型或地面拾取原点；后续 P1 使用世界空间原点驱动波前。</p>
        </section>
        <section>
          <h3>项目目标</h3>
          <p class="desc">让不同完整三维场景从数字虚空中逐步构建为真实世界。详见 <code>docs/PRODUCT.md</code>。</p>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
